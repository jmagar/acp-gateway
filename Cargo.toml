[package]
name = "acp-gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "acp-gateway"
path = "src/main.rs"

[lib]
name = "acp_gateway"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"

[dependencies]
acpx                 = "0.1"
agent-client-protocol = "0.10"
axum                 = { version = "0.8", features = ["json", "tokio", "http1", "http2"] }
tokio                = { version = "1",   features = ["full"] }
tokio-stream         = { version = "0.1", features = ["sync"] }
serde                = { version = "1",   features = ["derive"] }
serde_json           = "1"
dashmap              = "6"
tower-http           = { version = "0.6", features = ["cors", "trace"] }
uuid                 = { version = "1",   features = ["v4"] }
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
chrono               = { version = "0.4", features = ["serde"] }
thiserror            = "2"
anyhow               = "1"
futures              = "0.3"
async-stream         = "0.3"

[dev-dependencies]
axum-test = "19"
tempfile  = "3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
